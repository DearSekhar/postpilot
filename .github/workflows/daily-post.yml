name: Daily LinkedIn Post Draft

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

jobs:
  generate-and-email:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate post and send preview email
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_API_VERSION: '202601'
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APPROVE_BASE_URL: https://postpilot-approve-chandra.azurewebsites.net/api
        run: python main.py

      - name: Commit updated topic history
        run: |
          git config user.name "postpilot-bot"
          git config user.email "actions@github.com"
          git add agent/topic_history.json
          git diff --staged --quiet || git commit -m "Update topic history [skip ci]"
          git push
